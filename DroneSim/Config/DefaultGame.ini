[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=DroneSim
Description=DJI-style manual flight trainer

[DroneSim]
; TCP port for the phone controller web page / WebSocket
PhonePort=8080
; Landscape shown at start: 0 = Jondal fjord, 1 = Folgefonna glacier, 2 = Hardanger orchards (F2 switches in game)
StartScene=0

[/Script/UnrealEd.ProjectPackagingSettings]
; Ship the phone controller page (a loose file) with packaged builds
+DirectoriesToAlwaysStageAsNonUFS=(Path="Web")
+DirectoriesToAlwaysStageAsNonUFS=(Path="Terrain")
+MapsToCook=(FilePath="/Engine/Maps/Entry")
